<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-labelledby="title desc">
  <title id="title">Insta Bot V1</title>
  <desc id="desc">Animated neon network showing the Instagram bot and Chat API connection.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10052f"/>
      <stop offset="0.55" stop-color="#1e0d4b"/>
      <stop offset="1" stop-color="#061a36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4f9a"/>
      <stop offset="0.5" stop-color="#a66bff"/>
      <stop offset="1" stop-color="#43d9ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .drift { animation: drift 5s ease-in-out infinite; }
      .drift2 { animation: drift 5s ease-in-out 1.2s infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes drift { 0%,100% { transform: translateX(0); opacity: .25; } 50% { transform: translateX(28px); opacity: 1; } }
    </style>
  </defs>
  <rect width="920" height="220" rx="28" fill="url(#background)"/>
  <path d="M42 167 C180 48 254 204 392 89 S650 52 878 145" fill="none" stroke="#8c65ff" stroke-opacity=".18" stroke-width="2"/>
  <path d="M42 167 C180 48 254 204 392 89 S650 52 878 145" fill="none" stroke="url(#accent)" stroke-opacity=".9" stroke-width="3" stroke-dasharray="9 15"/>
  <g class="drift" filter="url(#glow)"><circle cx="122" cy="124" r="5" fill="#ff70b7"/></g>
  <g class="drift2" filter="url(#glow)"><circle cx="458" cy="101" r="5" fill="#bd9aff"/></g>
  <g class="pulse" filter="url(#glow)"><circle cx="782" cy="116" r="7" fill="#55e6ff"/></g>
  <g transform="translate(72 45)">
    <rect width="230" height="112" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#ff75b6" stroke-opacity=".75"/>
    <circle cx="56" cy="56" r="29" fill="none" stroke="#ff75b6" stroke-width="7"/>
    <circle cx="56" cy="56" r="11" fill="none" stroke="#ff75b6" stroke-width="6"/>
    <circle cx="78" cy="34" r="5" fill="#ff75b6"/>
    <text x="105" y="52" fill="#fff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">BOT</text>
    <text x="105" y="77" fill="#d9c9ff" font-family="system-ui, sans-serif" font-size="13">always waiting</text>
  </g>
  <g transform="translate(618 45)">
    <rect width="230" height="112" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#55e6ff" stroke-opacity=".75"/>
    <path d="M38 36h44v35H38z M38 36l22 18 22-18" fill="none" stroke="#55e6ff" stroke-width="5" stroke-linejoin="round"/>
    <text x="105" y="52" fill="#fff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">CHAT API</text>
    <text x="105" y="77" fill="#b9f3ff" font-family="system-ui, sans-serif" font-size="13">reconnects safely</text>
  </g>
  <text x="460" y="38" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" letter-spacing="4" opacity=".8">NEOKEX / RESILIENT AUTOMATION</text>
  <text x="460" y="191" text-anchor="middle" fill="url(#accent)" font-family="system-ui, sans-serif" font-size="18" font-weight="700">OFFLINE IS A STATE, NOT A SHUTDOWN</text>
</svg>
